# @format

services:
  db:
    image: "postgres:${DB_VERSION}"
    restart: always
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - CinaGloriaDB:/var/lib/postgresql/${DB_VERSION}/docker
    ports:
      - "${DB_PORT}:5432"
    networks:
      - db
  app:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - db
    volumes:
      - ./server:/app:rw
      - /app/node_modules
    env_file:
      - ./.env
    command: >
      sh -c "if [ \"$NODE_ENV\" = \"PRODUCTION\" ];
      then npm run start;
      else npx nest start --watch;
      fi"
    networks:
      - db
    ports:
      - ${PORT}:${PORT}

volumes:
  CinaGloriaDB:
networks:
  db:
